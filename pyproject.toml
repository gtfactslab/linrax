[project]
name = "linrax"
version = "0.3.0b1"
description = "A JAX-compatible, simplex method-based linear program solver"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.6.1",
]

[project.urls]
Repository = "https://github.com/gtfactslab/linrax.git"

[project.optional-dependencies]
cuda12 = [
    "jax[cuda12]>=0.6.1",
]
cuda13 = [
    "jax[cuda13]>=0.7.0",
]
examples = [
    "cvxpy~=1.9.0",
    "gurobipy~=12.0.0",
    "jaxopt~=0.8.3",
    "matplotlib~=3.9.2",
    "scipy~=1.17.1",
]

test = [
    "pytest~=8.1",
]

[tool.uv]
conflicts = [
    [
        {extra = "cuda12"},
        {extra = "cuda13"},
    ],
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]

[tool.ruff.lint]

ignore = ["E731"] # ignore "do not assign a lambda expression, use a def"

[tool.hatch.build.targets.wheel]
packages = ["linrax"]

[project]
name = "linrax"
version = "0.1.0"
description = "A JAX-compatible, simplex method-based linear program solver"
readme = "README.md"
requires-python = ">=3.11"

[project.urls]
Repository = "https://github.com/gtfactslab/linrax.git"

[project.optional-dependencies]
examples = [
    "cvxpy~=1.9.0",
    "gurobipy~=12.0.0",
    "jaxopt~=0.8.3",
    "matplotlib~=3.9.2",
    "scipy~=1.14.1",
]

[dependency-groups]
cpu = [
    "jax>=0.6.1",
]
cuda12 = [
    "jax[cuda12]>=0.6.1",
]
cuda13 = [
    "jax[cuda13]>=0.7.0",
]
test = [
    "pytest~=8.1",
]

[tool.uv]
conflicts = [
    [
        {extra = "cpu"},
        {extra = "cuda12"},
        {extra = "cuda13"},
    ],
]
default-groups = ["cpu"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]

[tool.ruff.lint]

ignore = ["E731"] # ignore "do not assign a lambda expression, use a def"

[tool.hatch.build.targets.wheel]
packages = ["linrax"]
